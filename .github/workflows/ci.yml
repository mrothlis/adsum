name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Proves a stranger can clone this and get a working server: the committed
  # tree is exported to a scratch directory, configured only from .env.example,
  # and started. Also fails if a secret, a database, or any identifier
  # belonging to the original author is ever committed.
  clean-install:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
        with:
          # verify_install.py exports HEAD, so it needs real history.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Byte-compile every module
        run: python -m compileall -q app scripts run.py backup_db.py

      - name: Verify a clean install
        run: python scripts/verify_install.py

      # `alembic upgrade head` on a brand-new database used to die with
      # NoSuchTableError: courses, because the migration history starts from
      # an existing schema and contains no CREATE TABLE. The install guide
      # told people to run it, and two readers hit that traceback. This
      # asserts both paths: a fresh database gets built and stamped at head,
      # and running it a second time changes nothing.
      - name: Migrations are safe on an empty database
        env:
          DATABASE_URL: sqlite+aiosqlite:///./ci-empty.db
          SECRET_KEY: ci-empty-database-migration-check-key-0123
          ADMIN_EMAIL: ci@example.edu
          ADMIN_PASSWORD: CiEmptyDatabaseCheck123!
        run: |
          python -m alembic upgrade head
          python - <<'PY'
          import sqlite3, sys
          db = sqlite3.connect("ci-empty.db")
          tables = {r[0] for r in db.execute(
              "SELECT name FROM sqlite_master WHERE type='table'")}
          for required in ("courses", "instructors", "attendance_records",
                           "lti_nonces", "alembic_version"):
              if required not in tables:
                  sys.exit(f"missing table after upgrade: {required}")
          stamped = db.execute("SELECT version_num FROM alembic_version").fetchone()
          if not stamped:
              sys.exit("database was not stamped at head")
          print(f"built {len(tables)} tables, stamped at {stamped[0]}")
          PY
          # Second run must be a no-op, not a replay.
          python -m alembic upgrade head 2>&1 | tee second.log
          if grep -q "Running upgrade" second.log; then
            echo "a second upgrade re-ran migrations on an up-to-date database"
            exit 1
          fi

      # The app applies its own pending migrations at startup, backing up
      # first. Covers the empty, current, unversioned, behind-head and
      # failing paths -- including that a failing migration does NOT take a
      # fresh backup on every restart, which would prune every good backup
      # within minutes of the launcher's retry loop.
      # WCAG 2.1 AA is a hard legal requirement for a public institution
      # (28 CFR 35.200(b); compliance date 26 Apr 2027 for larger entities).
      # This locks in the defects found by the browser audit so they cannot
      # come back silently. It is not a conformance claim; see
      # docs/ACCESSIBILITY.md.
      - name: Accessibility regressions
        run: python scripts/test_accessibility.py

      - name: Startup migrations back up, apply, and refuse safely
        env:
          DATABASE_URL: sqlite+aiosqlite:///./ci-startup.db
          SECRET_KEY: ci-startup-migration-check-key-0123456789
          ADMIN_EMAIL: ci@example.edu
          ADMIN_PASSWORD: CiStartupMigrationCheck123!
        run: python scripts/test_migrations.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install linters
        run: pip install ruff

      - name: Ruff
        run: ruff check app scripts run.py backup_db.py alembic/env.py

  # The isolation tests are the ones that catch a privacy regression, so they
  # run against a real server with a seeded course rather than being skipped.
  integration:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-0123456789
      ADMIN_EMAIL: admin@example.edu
      ADMIN_PASSWORD: CiTestPassword123!
      DATABASE_URL: sqlite+aiosqlite:///./ci.db
      BASE_URL: http://127.0.0.1:8000
      SEED_DEMO: "true"
      DEBUG: "false"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start the server
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8000/healthz; then echo; exit 0; fi
            sleep 1
          done
          echo "server failed to start"; exit 1

      - name: Scoring arithmetic
        run: python scripts/test_scoring.py

      - name: Smoke test
        run: python scripts/smoke_test.py

      - name: Instructor isolation
        run: python scripts/test_isolation.py

      - name: Admin separation
        run: python scripts/test_admin_separation.py

      - name: Admin page boundary
        run: python scripts/test_admin_page.py

      - name: Security regressions
        run: python scripts/test_security.py

      - name: Robustness regressions
        run: python scripts/test_robustness.py

      # The wrong-file guard and the exclusion of dropped students from the
      # D2L export. A failure here changes real grades, so it runs with the
      # rest of the integration job rather than being left to a local run.
      - name: Roster reconciliation
        run: python scripts/test_roster_sync.py

      # Grade integrity, end to end. This suite exists because test_scoring.py
      # passed throughout while two defects were altering real grades: all four
      # grade-bearing queries counted sessions that had not ended yet, so an
      # export during a live class lowered everyone who had not yet scanned;
      # and restore-from-d2l keyed sessions on the date, collapsing two
      # meetings held on one day. Neither is visible without a real server and
      # a real CSV, which is why this runs in the integration job.
      - name: Grade integrity and D2L round trip
        run: python scripts/test_grade_roundtrip.py

  # The container deployment, exercised rather than assumed. This job exists
  # because the Dockerfile and docker-compose.yml were written on a machine
  # with no Docker installed, so CI is the only thing that has ever run them.
  # It must stay: a container image that nobody builds rots silently, and the
  # first person to find out would be an IT team on a deadline.
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t adsum:ci .

      # A built image must carry no secrets and no institution's data. If
      # .dockerignore stops working, this is what notices. The database file
      # matters most: it holds every student's name and attendance.
      - name: The image contains no secrets and no data
        run: |
          set -eu
          leaked=0
          for path in /app/.env /app/adsum.db /app/CREDENTIALS.txt /app/.git; do
            if docker run --rm --entrypoint sh adsum:ci -c "test -e $path"; then
              echo "LEAKED into the image: $path"
              leaked=1
            fi
          done
          test "$leaked" = "0" || exit 1
          echo "no .env, no database, no credentials, no git history in the image"

      # Refusing to start unconfigured is a feature, so it is tested. An
      # install that silently came up with a placeholder SECRET_KEY would
      # issue forgeable session cookies.
      - name: An unconfigured container refuses to start
        run: |
          set -eu
          if docker run --rm adsum:ci > out.txt 2>&1; then
            echo "FAIL: started with no configuration"
            cat out.txt
            exit 1
          fi
          grep -qi "SECRET_KEY" out.txt || { echo "FAIL: refusal does not name the problem"; cat out.txt; exit 1; }
          echo "refused, and said why"

      # The real thing: run it the way the compose file does, read-only root
      # filesystem and all, and prove it serves. read_only is the setting
      # most likely to break, because the app writes a database, backups and
      # the .migration-failed marker, and all three had to be moved onto the
      # volume for it to work.
      - name: It starts, migrates itself and serves over a read-only root
        run: |
          set -eu
          docker volume create adsum-ci-data
          docker run -d --name adsum-ci \
            --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --security-opt no-new-privileges:true --cap-drop ALL \
            -v adsum-ci-data:/data \
            -e SECRET_KEY="$(head -c 48 /dev/urandom | base64 | tr -d '\n')" \
            -e ADMIN_PASSWORD='ci-not-a-real-password-012345' \
            -e ADMIN_EMAIL='ci@example.edu' \
            -e INSTITUTION_NAME='Example State University' \
            -e BASE_URL='http://127.0.0.1:8000' \
            -p 127.0.0.1:8000:8000 \
            adsum:ci

          for i in $(seq 1 45); do
            if curl -fsS --max-time 3 http://127.0.0.1:8000/healthz > /dev/null 2>&1; then
              echo "healthy after ${i}s"; break
            fi
            if [ "$i" = "45" ]; then
              echo "FAIL: never became healthy"; docker logs adsum-ci; exit 1
            fi
            sleep 1
          done

          curl -fsS http://127.0.0.1:8000/healthz | grep -q '"ok"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/)" = "200"
          echo "sign-in page served"

          # It runs as a non-root user. Running as root inside a container is
          # the finding an IT security review will raise first.
          test "$(docker exec adsum-ci id -u)" != "0"
          echo "running as uid $(docker exec adsum-ci id -u), not root"

          # The schema was applied by the app itself, on the volume.
          docker exec adsum-ci test -f /data/adsum.db
          echo "database created on the volume"

      # Docker's own health check, which is what an orchestrator restarts on.
      # A HEALTHCHECK that never reports healthy would make the container
      # restart forever in production while looking fine in a manual test.
      - name: Docker reports the container healthy
        run: |
          set -eu
          for i in $(seq 1 60); do
            status=$(docker inspect --format '{{.State.Health.Status}}' adsum-ci)
            [ "$status" = "healthy" ] && { echo "HEALTHCHECK: healthy"; exit 0; }
            [ "$status" = "unhealthy" ] && { echo "FAIL: unhealthy"; docker logs adsum-ci; exit 1; }
            sleep 2
          done
          echo "FAIL: still $status after 120s"; docker logs adsum-ci; exit 1

      # The backup must work against the running database and land on the
      # volume. A backup path that is not writable is only discovered on the
      # day the backup is needed.
      - name: The backup service writes to the volume
        run: |
          set -eu
          docker run --rm -v adsum-ci-data:/data \
            -e DATABASE_URL='sqlite+aiosqlite:////data/adsum.db' \
            -e BACKUP_DIR='/data/backups' \
            -e SECRET_KEY='not-used-by-the-backup-script-0123456789abcd' \
            -e ADMIN_PASSWORD='not-used' \
            adsum:ci python backup_db.py
          count=$(docker run --rm -v adsum-ci-data:/data --entrypoint sh adsum:ci \
                    -c 'ls -1 /data/backups/*.db 2>/dev/null | wc -l')
          test "$count" -ge 1 || { echo "FAIL: no backup written"; exit 1; }
          echo "backup written to the volume"

      # Restarting must not lose the data, which is the entire point of the
      # volume, and must not re-run the migrations destructively.
      - name: Data survives a restart
        run: |
          set -eu
          docker restart adsum-ci
          for i in $(seq 1 45); do
            curl -fsS --max-time 3 http://127.0.0.1:8000/healthz > /dev/null 2>&1 && break
            [ "$i" = "45" ] && { echo "FAIL: did not come back"; docker logs adsum-ci; exit 1; }
            sleep 1
          done
          docker exec adsum-ci test -f /data/adsum.db
          docker exec adsum-ci test ! -f /data/.migration-failed
          echo "came back with its data and no migration failure"

      - name: The compose file is valid
        run: |
          set -eu
          cp .env.example .env
          sed -i "s|^SECRET_KEY=.*|SECRET_KEY=ci-secret-key-at-least-32-characters-long-xx|" .env
          sed -i "s|^ADMIN_PASSWORD=.*|ADMIN_PASSWORD=ci-not-a-real-password-012345|" .env
          docker compose config > /dev/null
          echo "docker compose config parses"

      - name: Logs on failure
        if: failure()
        run: docker logs adsum-ci || true

      - name: Clean up
        if: always()
        run: |
          docker rm -f adsum-ci || true
          docker volume rm adsum-ci-data || true
