<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Adsum{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
    {% block head %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <a href="/">🎓 Adsum</a>
        </div>
        <div class="nav-links">
            {% if user %}
                <span class="nav-user">{{ user.name }}</span>
                {% if user.role == 'instructor' %}
                    <a href="/instructor/dashboard">Dashboard</a>
                    <a href="/instructor/logout">Logout</a>
                {% endif %}
            {% endif %}
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>Adsum &copy; {{ now().year if now is defined else "2026" }} {{ INSTITUTION_NAME }}</p>
    </footer>

    <script src="/static/app.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
