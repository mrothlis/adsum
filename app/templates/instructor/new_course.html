{% extends "base.html" %}
{% block title %}New course | Adsum{% endblock %}

{% block content %}
<div class="page-header">
    <div class="page-header-row">
        <div>
            <h1>New course</h1>
            <p class="subtitle">You will own this course. Nobody else can see it.</p>
        </div>
        <div class="page-actions">
            <a href="/instructor/dashboard" class="btn btn-outline">← Back</a>
        </div>
    </div>
</div>

{% if error %}
<div class="alert alert-danger" role="alert">
    <span aria-hidden="true">❌</span> {{ error }}
</div>
{% endif %}

<form method="post" action="/instructor/courses/new">
    <div class="card">
        <h2>Course details</h2>
        <div class="form-row">
            <div class="form-group">
                <label for="name">Course name</label>
                <input type="text" id="name" name="name" required
                       placeholder="Introduction to Business">
            </div>
            <div class="form-group">
                <label for="course_code">Course code <span class="text-muted">(optional)</span></label>
                <input type="text" id="course_code" name="course_code"
                       placeholder="BUSA2115">
                <small class="text-muted">Used in export filenames and on your dashboard.</small>
            </div>
        </div>
    </div>

    <button type="submit" class="btn btn-primary">Create course</button>
</form>
{% endblock %}
