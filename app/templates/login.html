{% extends "base.html" %}
{% block title %}Login | Adsum{% endblock %}

{% block content %}
<div class="login-container">
    <div class="card login-card">
        <h1><span aria-hidden="true">🎓</span> Adsum</h1>
        <p class="subtitle">Classroom Attendance Tracking</p>

        {% if error %}
        <div class="alert alert-error" role="alert" data-no-close="1">{{ error }}</div>
        {% endif %}

        <form method="post" action="/instructor/login" class="login-form">
            <div class="form-group">
                <label for="email">Instructor Email</label>
                <input type="email" id="email" name="email" required
                       placeholder="you@example.edu" autocomplete="email">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required
                       placeholder="Enter your password" autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-primary btn-block">Sign In</button>
        </form>

        <hr>
        <p class="text-muted text-center">
            Students: Scan the QR code displayed in your classroom to check in.
        </p>
    </div>
</div>
{% endblock %}
