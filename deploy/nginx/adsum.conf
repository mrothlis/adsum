# Adsum behind nginx.
#
# Copy to /etc/nginx/sites-available/adsum, then:
#   ln -s /etc/nginx/sites-available/adsum /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# Replace attendance.example.edu with your hostname. Get the certificate
# with certbot:
#   certbot --nginx -d attendance.example.edu
#
# The two settings people get wrong are marked THIS ONE MATTERS.

server {
    listen 80;
    listen [::]:80;
    server_name attendance.example.edu;

    # Students scan a QR code with a phone camera. A phone will not open a
    # page over plain HTTP from a camera app, and will not accept an
    # untrusted certificate, so there is no "we will add TLS later".
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name attendance.example.edu;

    ssl_certificate     /etc/letsencrypt/live/attendance.example.edu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/attendance.example.edu/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Adsum sets its own Content-Security-Policy, X-Frame-Options and the
    # rest per route, because the LTI launch needs different framing rules
    # from the instructor pages. Do not add security headers here: nginx
    # would either duplicate them or silently override a per-route decision
    # with a blanket one.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # A classlist CSV and a grade export are both small, but a 1 MB default
    # refuses a large course's roster with a bare 413 and no explanation.
    client_max_body_size 16m;

    access_log /var/log/nginx/adsum.access.log;
    error_log  /var/log/nginx/adsum.error.log;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # THIS ONE MATTERS. Adsum's login throttle limits failures per
        # account and per address. Without a forwarded address every request
        # looks like it came from this proxy, so one person's failed logins
        # lock out everybody. Set TRUSTED_PROXY_IPS in Adsum's .env to this
        # server's address, or the header is ignored and you are back where
        # you started.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # THIS ONE MATTERS. The live attendance list is server-sent events.
        # With buffering on, nginx holds the stream and names appear in a
        # batch minutes late, or never. The instructor sees a projector page
        # that looks frozen while students are checking in successfully, and
        # nothing in any log says why.
        proxy_buffering off;
        proxy_cache off;

        # The SSE connection is long-lived by design. The default 60s read
        # timeout would drop the live roster every minute of every class.
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }
}
